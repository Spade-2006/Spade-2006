<svg width="1200" height="620" viewBox="0 0 1200 620" xmlns="http://www.w3.org/2000/svg">

<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#090612"/>
    <stop offset="50%" stop-color="#12091f"/>
    <stop offset="100%" stop-color="#07050d"/>
  </linearGradient>

  <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="50%" stop-color="#a855f7"/>
    <stop offset="100%" stop-color="#38bdf8"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/>
  </pattern>
</defs>

<!-- Background -->
<rect width="1200" height="620" rx="24" fill="url(#bg)"/>
<rect width="1200" height="620" rx="24" fill="url(#grid)"/>

<!-- Header -->
<circle cx="42" cy="42" r="6" fill="#ff5f57"/>
<circle cx="62" cy="42" r="6" fill="#febc2e"/>
<circle cx="82" cy="42" r="6" fill="#28c840"/>

<text x="110" y="48"
      fill="#8b8b9c"
      font-family="monospace"
      font-size="15">
  satyansh@github ~/projects
</text>

<text x="60" y="105"
      fill="white"
      font-family="sans-serif"
      font-weight="700"
      font-size="34">
  PROJECTS
</text>

<rect x="60" y="125" width="1080" height="2" fill="url(#line)" filter="url(#glow)"/>

<!-- Card 1 -->
<rect x="60" y="155" width="520" height="185" rx="18"
      fill="#0d0917"
      stroke="#7c3aed"
      stroke-opacity=".5"/>

<text x="90" y="195"
