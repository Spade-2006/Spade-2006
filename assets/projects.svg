</text>

<text x="90" y="285"
      fill="#71717a"
      font-family="sans-serif"
      font-size="13">
  React • Phaser • Node • Express • Vite
</text>

<rect x="90" y="305" width="150" height="6" rx="3" fill="#272033"/>
<rect x="90" y="305" width="112" height="6" rx="3" fill="#a855f7">
  <animate attributeName="width"
           values="80;145;80"
           dur="3s"
           repeatCount="indefinite"/>
</rect>

