<svg width="1200" height="610" viewBox="0 0 1200 610" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#08060d"/>
    <stop offset="50%" stop-color="#12091d"/>
    <stop offset="100%" stop-color="#06070c"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="100%" stop-color="#c084fc"/>
  </linearGradient>

  <pattern id="grid" width="38" height="38" patternUnits="userSpaceOnUse">
    <path d="M38 0H0V38"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".035"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="b"/>
    <feMerge>
      <feMergeNode in="b"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- BACKGROUND -->

<rect width="1200" height="610" rx="24" fill="url(#bg)"/>
<rect width="1200" height="610" rx="24" fill="url(#grid)"/>


<!-- TERMINAL -->

<rect x="25" y="20" width="1150" height="48" rx="14"
