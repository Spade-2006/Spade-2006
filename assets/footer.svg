<svg width="1200" height="330" viewBox="0 0 1200 330" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#08060d"/>
    <stop offset="50%" stop-color="#14091f"/>
    <stop offset="100%" stop-color="#07080d"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="50%" stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#38bdf8"/>
  </linearGradient>

  <pattern id="grid" width="36" height="36" patternUnits="userSpaceOnUse">
    <path d="M36 0H0V36"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".035"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- Background -->
<rect width="1200" height="330" rx="24" fill="url(#bg)"/>
<rect width="1200" height="330" rx="24" fill="url(#grid)"/>

<!-- Top accent -->
<rect x="70" y="28" width="1060" height="2" fill="url(#accent)" opacity=".7"/>

<!-- Terminal -->
<circle cx="72" cy="60" r="5" fill="#ff5f57"/>
<circle cx="90" cy="60" r="5" fill="#febc2e"/>
<circle cx="108" cy="60" r="5" fill="#28c840"/>

<text x="135" y="65"
      fill="#77717f"
      font-family="monospace"
      font-size="13">
  satyansh@github ~/connect
</text>

<!-- Main -->
<text x="600"
      y="125"
      text-anchor="middle"
      fill="#ffffff"
      font-family="sans-serif"
      font-size="32"
      font-weight="700">
  LET'S BUILD SOMETHING.
</text>

<text x="600"
      y="155"
      text-anchor="middle"
      fill="#8b7b99"
      font-family="monospace"
      font-size="12">
  ideas are cheap • building them is the fun part
</text>

<!-- Contact buttons -->

<rect x="250" y="190"
      width="150"
      height="48"
      rx="14"
      fill="#0d0917"
      stroke="#8b5cf6"
      stroke-opacity=".45"/>

<text x="325" y="220"
      text-anchor="middle"
      fill="#c084fc"
      font-family="monospace"
      font-size="12">
  💼 LINKEDIN
</text>


<rect x="420" y="190"
      width="150"
      height="48"
      rx="14"
      fill="#0d0917"
      stroke="#8b5cf6"
      stroke-opacity=".45"/>

<text x="495" y="220"
      text-anchor="middle"
      fill="#c084fc"
      font-family="monospace"
      font-size="12">
  🐙 GITHUB
</text>


<rect x="590" y="190"
      width="150"
      height="48"
      rx="14"
      fill="#0d0917"
      stroke="#38bdf8"
      stroke-opacity=".4"/>

<text x="665" y="220"
      text-anchor="middle"
      fill="#67d5fa"
      font-family="monospace"
      font-size="12">
  📧 EMAIL
</text>


<rect x="760" y="190"
      width="150"
      height="48"
      rx="14"
      fill="#0d0917"
      stroke="#38bdf8"
      stroke-opacity=".4"/>

<text x="835" y="220"
      text-anchor="middle"
      fill="#67d5fa"
      font-family="monospace"
      font-size="12">
  📸 INSTAGRAM
</text>


<!-- Footer line -->

<rect x="70" y="275"
      width="1060"
      height="1"
      fill="#ffffff"
      opacity=".08"/>

<text x="70"
      y="300"
      fill="#51485a"
      font-family="monospace"
      font-size="10">
  © 2026 SATYANSH ACHARYA
</text>

<text x="1130"
      y="300"
      text-anchor="end"
      fill="#51485a"
      font-family="monospace"
      font-size="10">
  BUILD • BREAK • LEARN • REPEAT
</text>

<!-- blinking cursor -->

<rect x="600"
      y="315"
      width="7"
      height="12"
      fill="#a855f7"
      filter="url(#glow)">
  <animate attributeName="opacity"
           values="1;0;1"
           dur="1s"
           repeatCount="indefinite"/>
</rect>

</svg>
