<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="panel" x1="0" y1="0" x2="1200" y2="360">
    <stop stop-color="#080B18"/>
    <stop offset="1" stop-color="#120B24"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1000" y2="0">
    <stop stop-color="#6366F1"/>
    <stop offset="0.5" stop-color="#A855F7"/>
    <stop offset="1" stop-color="#EC4899"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="6" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- Main panel -->

<rect
  x="20"
  y="20"
  width="1160"
  height="320"
  rx="22"
  fill="url(#panel)"
  stroke="#8B5CF6"
  stroke-opacity="0.25"/>

<!-- Header -->

<circle cx="55" cy="55" r="5" fill="#EF4444"/>
<circle cx="73" cy="55" r="5" fill="#F59E0B"/>
<circle cx="91" cy="55" r="5" fill="#22C55E"/>

<text
  x="115"
  y="60"
  fill="#64748B"
  font-family="monospace"
  font-size="14">
  satyansh@github ~/about
</text>

<rect
  x="40"
  y="82"
  width="1120"
  height="1"
  fill="#8B5CF6"
  opacity="0.2"/>

<!-- Title -->

<text
  x="60"
  y="125"
  fill="white"
  font-family="Arial, Helvetica, sans-serif"
  font-size="27"
  font-weight="700">
  ABOUT.ME
</text>

<text
  x="60"
  y="157"
  fill="#94A3B8"
  font-family="monospace"
  font-size="14">
  Building systems. Solving problems. Learning constantly.
</text>

<!-- Main description -->

<text
  x="60"
  y="205"
  fill="#CBD5E1"
  font-family="Arial, Helvetica, sans-serif"
  font-size="16">
  Computer Science student focused on full-stack development,
</text>

<text
  x="60"
  y="232"
  fill="#CBD5E1"
  font-family="Arial, Helvetica, sans-serif"
  font-size="16">
  backend engineering, DSA, system design and intelligent systems.
</text>

<!-- Right side -->

<rect
  x="790"
  y="110"
  width="330"
  height="170"
  rx="16"
  fill="#050816"
  stroke="#8B5CF6"
  stroke-opacity="0.3"/>

<text
  x="820"
  y="140"
  fill="#A78BFA"
  font-family="monospace"
  font-size="13">
  CURRENT FOCUS
</text>

<circle cx="825" cy="170" r="5" fill="#22C55E">
  <animate
    attributeName="opacity"
    values="1;0.25;1"
    dur="1.5s"
    repeatCount="indefinite"/>
</circle>

<text
  x="845"
  y="175"
  fill="#E2E8F0"
  font-family="monospace"
  font-size="14">
  Full-Stack Systems
</text>

<circle cx="825" cy="202" r="5" fill="#A855F7">
  <animate
    attributeName="opacity"
    values="0.3;1;0.3"
    dur="2s"
    repeatCount="indefinite"/>
</circle>

<text
  x="845"
  y="207"
  fill="#E2E8F0"
  font-family="monospace"
  font-size="14">
  Backend Architecture
</text>

<circle cx="825" cy="234" r="5" fill="#6366F1"/>

<text
  x="845"
  y="239"
  fill="#E2E8F0"
  font-family="monospace"
  font-size="14">
  DSA &amp; Systems
</text>

<circle cx="825" cy="266" r="5" fill="#EC4899"/>

<text
  x="845"
  y="271"
  fill="#E2E8F0"
  font-family="monospace"
  font-size="14">
  AI / RAG / Agents
</text>

<!-- Bottom progress -->

<rect
  x="60"
  y="285"
  width="660"
  height="5"
  rx="3"
  fill="#1E293B"/>

<rect
  x="60"
  y="285"
  width="430"
  height="5"
  rx="3"
  fill="url(#accent)">

  <animate
    attributeName="width"
    values="350;500;350"
    dur="5s"
    repeatCount="indefinite"/>

</rect>

<text
  x="60"
  y="315"
  fill="#64748B"
  font-family="monospace"
  font-size="12">
  BUILD • LEARN • EXPERIMENT • SHIP
</text>

</svg>
