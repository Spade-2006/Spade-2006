<svg width="1200" height="360" viewBox="0 0 1200 360" fill="none" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360">
    <stop stop-color="#050816"/>
    <stop offset="0.5" stop-color="#0B1026"/>
    <stop offset="1" stop-color="#160B2D"/>
  </linearGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1200" y2="0">
    <stop stop-color="#6366F1"/>
    <stop offset="0.5" stop-color="#A855F7"/>
    <stop offset="1" stop-color="#EC4899"/>
  </linearGradient>

  <radialGradient id="glow">
    <stop stop-color="#8B5CF6" stop-opacity="0.35"/>
    <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
  </radialGradient>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40" stroke="#8B5CF6" stroke-opacity="0.08"/>
  </pattern>

  <filter id="blur">
    <feGaussianBlur stdDeviation="35"/>
  </filter>

  <filter id="textGlow">
    <feGaussianBlur stdDeviation="4" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>

<!-- Background -->

<rect width="1200" height="360" rx="24" fill="url(#bg)"/>

<!-- Grid -->

<rect width="1200" height="360" fill="url(#grid)"/>

<!-- Ambient glows -->

<circle cx="160" cy="90" r="180" fill="url(#glow)" filter="url(#blur)">
  <animate
    attributeName="cx"
    values="160;250;160"
    dur="8s"
    repeatCount="indefinite"/>
</circle>

<circle cx="1030" cy="270" r="200" fill="url(#glow)" filter="url(#blur)">
  <animate
    attributeName="cy"
    values="270;190;270"
    dur="10s"
    repeatCount="indefinite"/>
</circle>

<!-- Floating particles -->

<g fill="#A78BFA">

  <circle cx="120" cy="70" r="2">
    <animate attributeName="cy" values="70;45;70" dur="4s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="4s" repeatCount="indefinite"/>
  </circle>

  <circle cx="1040" cy="80" r="2">
    <animate attributeName="cy" values="80;55;80" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>

  <circle cx="930" cy="300" r="2">
    <animate attributeName="cy" values="300;275;300" dur="6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="260" cy="300" r="2">
    <animate attributeName="cy" values="300;275;300" dur="5s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/>
  </circle>

</g>

<!-- Top accent -->

<rect x="80" y="42" width="1040" height="2" rx="2" fill="url(#purple)">
  <animate
    attributeName="opacity"
    values="0.4;1;0.4"
    dur="3s"
    repeatCount="indefinite"/>
</rect>

<!-- Terminal dots -->

<circle cx="100" cy="72" r="5" fill="#EF4444"/>
<circle cx="118" cy="72" r="5" fill="#F59E0B"/>
<circle cx="136" cy="72" r="5" fill="#22C55E"/>

<!-- Terminal label -->

<text
  x="160"
  y="77"
  fill="#64748B"
  font-family="monospace"
  font-size="13">
  satyansh@github:~$
</text>

<!-- Main name -->

<text
  x="600"
  y="170"
  text-anchor="middle"
  fill="white"
  font-family="Arial, Helvetica, sans-serif"
  font-size="52"
  font-weight="700"
  filter="url(#textGlow)">
  SATYANSH ACHARYA
</text>

<!-- Animated underline -->

<rect
  x="400"
  y="190"
  width="400"
  height="2"
  rx="2"
  fill="url(#purple)">

  <animate
    attributeName="width"
    values="250;400;250"
    dur="4s"
    repeatCount="indefinite"/>

  <animate
    attributeName="x"
    values="475;400;475"
    dur="4s"
    repeatCount="indefinite"/>

</rect>

<!-- Subtitle -->

<text
  x="600"
  y="235"
  text-anchor="middle"
  fill="#CBD5E1"
  font-family="monospace"
  font-size="17">

  FULL-STACK  •  BACKEND  •  SYSTEMS  •  AI

</text>

<!-- Status -->

<circle cx="465" cy="278" r="5" fill="#22C55E">
  <animate
    attributeName="opacity"
    values="1;0.25;1"
    dur="1.5s"
    repeatCount="indefinite"/>
</circle>

<text
  x="480"
  y="283"
  fill="#94A3B8"
  font-family="monospace"
  font-size="13">

  BUILDING • LEARNING • SHIPPING

</text>

<!-- Bottom accent -->

<rect x="80" y="315" width="1040" height="1" fill="url(#purple)" opacity="0.5"/>

</svg>
