<svg xmlns="http://www.w3.org/2000/svg"
     width="1200"
     height="520"
     viewBox="0 0 1200 520">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#080612"/>
    <stop offset=".5" stop-color="#10091f"/>
    <stop offset="1" stop-color="#070914"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" x2="1">
    <stop stop-color="#7c3aed"/>
    <stop offset=".5" stop-color="#22d3ee"/>
    <stop offset="1" stop-color="#a855f7"/>
  </linearGradient>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

  <filter id="softGlow">
    <feGaussianBlur stdDeviation="18"/>
  </filter>

  <style>

    .terminal{
      font-family:"Courier New",monospace;
      font-size:13px;
      fill:#64748b;
      letter-spacing:1px
    }

    .command{
      font-family:"Courier New",monospace;
      font-size:14px;
      fill:#94a3b8
    }

    .name{
      font-family:Inter,Arial,sans-serif;
      font-size:34px;
      font-weight:800;
      fill:#f8fafc;
      letter-spacing:2px
    }

    .role{
      font-family:Inter,Arial,sans-serif;
      font-size:15px;
      font-weight:500;
      fill:#a78bfa;
      letter-spacing:1px
    }

    .label{
      font-family:"Courier New",monospace;
      font-size:11px;
      fill:#64748b;
      letter-spacing:1.5px
    }

    .text{
      font-family:Inter,Arial,sans-serif;
      font-size:14px;
      fill:#cbd5e1
    }

    .muted{
      font-family:Inter,Arial,sans-serif;
      font-size:12px;
      fill:#64748b
    }

    .tree{
      font-family:"Courier New",monospace;
      font-size:13px;
      fill:#94a3b8
    }

    .value{
      fill:#e2e8f0
    }

  </style>

</defs>


<!-- ================================================= -->
<!-- BACKGROUND -->
<!-- ================================================= -->

<rect
  width="1200"
  height="520"
  rx="28"
  fill="url(#bg)"
/>

<circle
  cx="180"
  cy="270"
  r="150"
  fill="#7c3aed"
  opacity=".08"
  filter="url(#softGlow)"
/>

<circle
  cx="1030"
  cy="300"
  r="180"
  fill="#22d3ee"
  opacity=".05"
  filter="url(#softGlow)"
/>


<!-- ================================================= -->
