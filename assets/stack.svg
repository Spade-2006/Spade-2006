<svg width="1200" height="720" viewBox="0 0 1200 720" xmlns="http://www.w3.org/2000/svg">

<defs>

  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#08060d"/>
    <stop offset="50%" stop-color="#12091d"/>
    <stop offset="100%" stop-color="#06080e"/>
  </linearGradient>

  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0%" stop-color="#7c3aed"/>
    <stop offset="50%" stop-color="#c084fc"/>
    <stop offset="100%" stop-color="#38bdf8"/>
  </linearGradient>

  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0H0V40"
          fill="none"
          stroke="#ffffff"
          stroke-opacity=".035"/>
  </pattern>

  <filter id="glow">
    <feGaussianBlur stdDeviation="5" result="blur"/>
    <feMerge>
      <feMergeNode in="blur"/>
      <feMergeNode in="SourceGraphic"/>
    </feMerge>
  </filter>

</defs>


<!-- ===================================================== -->
<!-- BACKGROUND -->
<!-- ===================================================== -->

<rect width="1200" height="720" rx="26" fill="url(#bg)"/>
<rect width="1200" height="720" rx="26" fill="url(#grid)"/>


<!-- ambient lights -->

<circle cx="1100" cy="100" r="100"
        fill="#7c3aed"
        opacity=".06"/>

<circle cx="100" cy="650" r="100"
        fill="#38bdf8"
        opacity=".04"/>


